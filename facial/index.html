<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="description" content="FlowFace — câmera de acesso por rosto do PhysikFlow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>FlowFace</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <div class="app">
    <section class="rest" id="rest" aria-label="Tela de descanso">
      <div class="rest-mark">FLOWFACE</div>
      <div class="rest-center">
        <div class="logo">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M8 13V9a1 1 0 0 1 1-1h4M19 8h4a1 1 0 0 1 1 1v4M24 19v4a1 1 0 0 1-1 1h-4M13 24H9a1 1 0 0 1-1-1v-4"/>
            <circle cx="16" cy="15" r="3.2"/>
            <path d="M11.5 22c.9-2.2 2.4-3.2 4.5-3.2s3.6 1 4.5 3.2"/>
          </svg>
        </div>
        <div class="rest-title">Aproxime-se para acessar</div>
        <div class="rest-sub"><span class="pulse loading" id="restPulse"></span><span id="restStatus">Carregando detector…</span></div>
      </div>
    </section>

    <section class="camera" id="camera">
      <video id="video" autoplay playsinline muted disablepictureinpicture></video>
      <canvas class="overlay" id="overlay" aria-hidden="true"></canvas>
      <div class="scrim"></div>

      <div class="top">
        <div class="brand" id="brand">FLOWFACE</div>
        <div class="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Inicializando…</span>
        </div>
      </div>

      <div class="face-target" id="faceTarget"></div>

      <!-- Painel técnico: três toques em FLOWFACE, ou a tecla D -->
      <dl class="stats" id="stats" hidden>
        <div><dt>Tela</dt><dd id="statRender">--</dd></div>
        <div><dt>Detecção</dt><dd id="statDetect">--</dd></div>
        <div><dt>Inferência</dt><dd id="statInfer">--</dd></div>
        <div><dt>Entrada</dt><dd id="statInput">--</dd></div>
        <div><dt>Motor</dt><dd id="statEngine">--</dd></div>
        <div><dt>Rosto</dt><dd id="statFace">--</dd></div>
      </dl>
      <div class="captures" id="captures" hidden></div>

      <div class="instruction" id="instruction" role="status" aria-live="polite">Olhe para a câmera</div>

      <button class="close" id="close" type="button" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>

      <div class="message" id="message" role="alert">
        <strong id="messageTitle"></strong>
        <span id="messageText"></span>
      </div>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Carregando detector…</div>
      </div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
