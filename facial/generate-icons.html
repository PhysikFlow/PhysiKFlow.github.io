<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <script>
    function generateIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = '#08090c';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.15);
      ctx.fill();
      
      // Border
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // Face icon
      const cx = size / 2;
      const cy = size / 2;
      const scale = size / 512;
      
      ctx.strokeStyle = 'rgba(255,255,255,0.88)';
      ctx.lineWidth = 8 * scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      // Face outline corners
      const offset = 120 * scale;
      const cornerSize = 50 * scale;
      
      // Top-left
      ctx.beginPath();
      ctx.moveTo(cx - offset, cy - offset + cornerSize);
      ctx.lineTo(cx - offset, cy - offset);
      ctx.lineTo(cx - offset + cornerSize, cy - offset);
      ctx.stroke();
      
      // Top-right
      ctx.beginPath();
      ctx.moveTo(cx + offset - cornerSize, cy - offset);
      ctx.lineTo(cx + offset, cy - offset);
      ctx.lineTo(cx + offset, cy - offset + cornerSize);
      ctx.stroke();
      
      // Bottom-right
      ctx.beginPath();
      ctx.moveTo(cx + offset, cy + offset - cornerSize);
      ctx.lineTo(cx + offset, cy + offset);
      ctx.lineTo(cx + offset - cornerSize, cy + offset);
      ctx.stroke();
      
      // Bottom-left
      ctx.beginPath();
      ctx.moveTo(cx - offset + cornerSize, cy + offset);
      ctx.lineTo(cx - offset, cy + offset);
      ctx.lineTo(cx - offset, cy + offset - cornerSize);
      ctx.stroke();
      
      // Eyes
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.beginPath();
      ctx.arc(cx - 40 * scale, cy - 20 * scale, 12 * scale, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(cx + 40 * scale, cy - 20 * scale, 12 * scale, 0, Math.PI * 2);
      ctx.fill();
      
      // Smile
      ctx.beginPath();
      ctx.arc(cx, cy + 10 * scale, 45 * scale, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }
    
    generateIcon(document.getElementById('canvas192'), 192);
    generateIcon(document.getElementById('canvas512'), 512);
  </script>
</body>
</html>
