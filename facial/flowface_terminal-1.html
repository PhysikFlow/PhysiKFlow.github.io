<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>Face Access — Terminal</title>
<style>
:root{
  --bg:#08090c;
  --fg:#f5f7fa;
  --muted:#9aa1ac;
  --line:rgba(255,255,255,.12);
  --glass:rgba(10,12,16,.58);
  --ok:#70e0a3;
  --danger:#ff7777;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg)}
button{font:inherit}
.app{position:fixed;inset:0;background:var(--bg);overflow:hidden}

/* REST */
.rest{
  position:absolute;inset:0;display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.055),transparent 34%),
    var(--bg);
  cursor:pointer;
  transition:opacity .45s ease,transform .55s ease;
}
.rest.hidden{opacity:0;pointer-events:none;transform:scale(1.025)}
.rest-mark{
  position:absolute;top:30px;left:34px;
  font-size:14px;font-weight:650;letter-spacing:.08em;
  color:rgba(255,255,255,.72);
}
.rest-center{text-align:center;transform:translateY(-3vh)}
.logo{
  width:58px;height:58px;margin:0 auto 22px;border:1px solid var(--line);
  border-radius:18px;display:grid;place-items:center;
  background:rgba(255,255,255,.025);
}
.logo svg{width:28px;height:28px;opacity:.88}
.rest-title{font-size:clamp(22px,3vw,34px);font-weight:560;letter-spacing:-.025em}
.rest-sub{margin-top:10px;font-size:14px;color:var(--muted)}
.pulse{
  width:7px;height:7px;border-radius:50%;background:var(--ok);
  display:inline-block;margin-right:7px;vertical-align:1px;
  box-shadow:0 0 0 0 rgba(112,224,163,.4);
  animation:pulse 2.1s infinite;
}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(112,224,163,0)}100%{box-shadow:0 0 0 0 rgba(112,224,163,0)}}

/* CAMERA */
.camera{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  background:#000;transition:opacity .45s ease;
}
.camera.active{opacity:1;pointer-events:auto}
video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transform:scaleX(-1);
}
.scrim{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.42),transparent 24%,transparent 72%,rgba(0,0,0,.48));
  pointer-events:none;
}
.top{
  position:absolute;top:0;left:0;right:0;
  padding:28px 30px;display:flex;align-items:center;justify-content:space-between;
}
.brand{font-size:13px;letter-spacing:.09em;font-weight:650;color:rgba(255,255,255,.8)}
.status{font-size:12px;color:rgba(255,255,255,.68);display:flex;align-items:center}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:7px}

/* Future face target */
.face-target{
  position:absolute;left:50%;top:48%;width:min(42vw,300px);height:min(52vw,380px);
  transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.16);
  border-radius:42% 42% 44% 44%;opacity:.0;
  transition:opacity .3s;
}
.camera.show-target .face-target{opacity:.9}
.face-target::before,.face-target::after{
  content:"";position:absolute;width:27px;height:27px;
}
.face-target::before{top:-1px;left:-1px;border-top:2px solid #fff;border-left:2px solid #fff;border-radius:12px 0 0 0}
.face-target::after{right:-1px;bottom:-1px;border-right:2px solid #fff;border-bottom:2px solid #fff;border-radius:0 0 12px 0}
.corner-bl,.corner-tr{
  position:absolute;width:27px;height:27px;opacity:.85;
}
.corner-bl{left:-1px;bottom:-1px;border-left:2px solid #fff;border-bottom:2px solid #fff;border-radius:0 0 0 12px}
.corner-tr{right:-1px;top:-1px;border-right:2px solid #fff;border-top:2px solid #fff;border-radius:0 12px 0 0}

.instruction{
  position:absolute;left:50%;bottom:40px;transform:translateX(-50%);
  padding:10px 15px;border-radius:999px;background:var(--glass);
  backdrop-filter:blur(12px);font-size:13px;color:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.08);white-space:nowrap;
}
.close{
  position:absolute;right:25px;bottom:25px;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);
  color:white;display:grid;place-items:center;cursor:pointer;opacity:.72;
  backdrop-filter:blur(10px);
}
.close:hover{opacity:1;background:rgba(0,0,0,.55)}
.close svg{width:17px;height:17px}

.message{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:18px 22px;border-radius:18px;background:rgba(8,9,12,.76);
  backdrop-filter:blur(16px);border:1px solid var(--line);text-align:center;
  display:none;min-width:240px;
}
.message.show{display:block}
.message strong{display:block;font-size:18px}
.message span{display:block;margin-top:6px;color:var(--muted);font-size:13px}

@media(max-width:600px){
  .rest-mark{top:22px;left:22px}
  .top{padding:22px}
  .instruction{bottom:25px;font-size:12px}
  .close{right:18px;bottom:18px}
}
</style>
</head>
<body>
<div class="app">

  <section class="rest" id="rest" aria-label="Tela de descanso">
    <div class="rest-mark">FLOWFACE</div>
    <div class="rest-center">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M8 13V9a1 1 0 0 1 1-1h4M19 8h4a1 1 0 0 1 1 1v4M24 19v4a1 1 0 0 1-1 1h-4M13 24H9a1 1 0 0 1-1-1v-4"/>
          <circle cx="16" cy="15" r="3.2"/>
          <path d="M11.5 22c.9-2.2 2.4-3.2 4.5-3.2s3.6 1 4.5 3.2"/>
        </svg>
      </div>
      <div class="rest-title">Aproxime-se para acessar</div>
      <div class="rest-sub"><span class="pulse"></span>Terminal pronto</div>
    </div>
  </section>

  <section class="camera" id="camera">
    <video id="video" autoplay playsinline muted></video>
    <div class="scrim"></div>

    <div class="top">
      <div class="brand">FLOWFACE</div>
      <div class="status"><span class="status-dot"></span>Pronto</div>
    </div>

    <!-- Alvo reservado para o futuro rastreamento facial -->
    <div class="face-target" id="faceTarget">
      <div class="corner-bl"></div><div class="corner-tr"></div>
    </div>

    <div class="instruction" id="instruction">Olhe para a câmera</div>

    <button class="close" id="close" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

    <div class="message" id="message">
      <strong id="messageTitle">Acesso liberado</strong>
      <span id="messageText">Bem-vindo.</span>
    </div>
  </section>
</div>

<script>
const rest = document.getElementById('rest');
const camera = document.getElementById('camera');
const video = document.getElementById('video');
const closeBtn = document.getElementById('close');
const instruction = document.getElementById('instruction');
const faceTarget = document.getElementById('faceTarget');
const message = document.getElementById('message');
let stream = null;

async function enterCamera(){
  rest.classList.add('hidden');
  camera.classList.add('active');

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'user'},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });
    video.srcObject = stream;
    instruction.textContent = 'Olhe para a câmera';
  }catch(err){
    instruction.textContent = 'Câmera indisponível';
    console.warn('Câmera:', err);
  }

  // Apenas demonstração visual do futuro rastreamento.
  // Substituir por detector facial real posteriormente.
  setTimeout(() => camera.classList.add('show-target'), 900);
}

function leaveCamera(){
  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  camera.classList.remove('active','show-target');
  message.classList.remove('show');
  rest.classList.remove('hidden');
}

rest.addEventListener('click', enterCamera);
closeBtn.addEventListener('click', leaveCamera);

// Atalho para testar sem tocar na tela.
window.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !camera.classList.contains('active')) enterCamera();
  if(e.key === 'Escape' && camera.classList.contains('active')) leaveCamera();
});

// Para desenvolvimento: toque/clique na área da câmera para simular reconhecimento.
// Isso não representa reconhecimento facial real.
video.addEventListener('click', () => {
  if(!camera.classList.contains('active')) return;
  message.classList.add('show');
  document.getElementById('messageTitle').textContent = 'Acesso liberado';
  document.getElementById('messageText').textContent = 'Reconhecimento confirmado';
  instruction.textContent = '';
  setTimeout(() => {
    message.classList.remove('show');
    instruction.textContent = 'Olhe para a câmera';
  }, 1800);
});
</script>
</body>
</html>
